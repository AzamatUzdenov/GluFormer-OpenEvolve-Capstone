# Software environment of this project. Edit it with `pixi add <package>`;
# Pixi records the exact versions it installed in pixi.lock (commit both).
[workspace]
name = "capstone-project"
description = "Reproducible subset of an existing analysis; source selection pending"
authors = ["Azamat Uzdenov <azamuzdenov@gmail.com>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
version = "0.1.0"

[dependencies]
python = "3.13.*"
quarto = ">=1.9"
jupyterlab = ">=4"
ipykernel = ">=7"
pandas = ">=2"
matplotlib = ">=3.9"
papermill = ">=2.6"   # Quarto needs it for report parameters (-P)

[tasks]
check = { cmd = "python --version && quarto --version", description = "Check that the tools work" }
# `reproduce` must rebuild every result from the raw data with one command.
# The source analysis is pending; the guard exits nonzero until it is connected.
reproduce = { cmd = "python scripts/reproduce.py", description = "Awaiting source selection; exits with code 2" }
