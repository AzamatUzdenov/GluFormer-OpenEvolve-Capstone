[workspace]
name = "gluformer-openevolve-capstone"
description = "Reproduce and audit the saved OpenEvolve-selected HbA1c head"
authors = ["Azamat Uzdenov <azamuzdenov@gmail.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]
version = "0.1.1"

[dependencies]
python = "3.10.*"
numpy = "==1.26.4"
pandas = "==2.2.2"
scikit-learn = "==1.5.0"
scipy = "==1.14.0"
matplotlib = ">=3.9,<4"
quarto = ">=1.9,<1.11"
jupyterlab = ">=4,<5"
ipykernel = ">=6,<7"
papermill = ">=2.6,<3"

[tasks]
download = "python scripts/download_data.py"
audit = { cmd = "python scripts/audit_data.py", depends-on = ["download"] }
replay = { cmd = "python scripts/replay.py", depends-on = ["audit"] }
notebook = { cmd = "python scripts/run_notebook.py", depends-on = ["download"] }
report = { cmd = "python scripts/render_report.py", depends-on = ["replay", "notebook"] }
reproduce = { depends-on = ["report"] }
check = "python -m unittest discover -s tests -v"
match-historical = "python scripts/check_historical_match.py"
